<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School ERP | Login</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <!-- Import Map for Firebase Modular SDK -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js",
                "firebase/database": "https://www.gstatic.com/firebasejs/10.12.4/firebase-database.js"
            }
        }
    </script>
    <style>
        /* quick login styles (same as before) */
        body {
            background: var(--gray-100);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        .login-card {
            background: var(--white);
            border-radius: var(--border-radius);
            border: 1px solid var(--gray-200);
            padding: 32px 28px;
            box-shadow: var(--shadow-md);
        }
        .login-brand {
            text-align: center;
            margin-bottom: 28px;
        }
        .login-brand h1 {
            font-size: 26px;
            font-weight: 700;
            color: var(--gray-900);
            letter-spacing: -0.5px;
        }
        .login-brand span {
            color: var(--primary);
        }
        .login-brand p {
            color: var(--gray-500);
            font-size: 14px;
            margin-top: 4px;
        }
        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--gray-500);
        }
        .login-footer a {
            color: var(--primary);
            font-weight: 500;
        }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn-loading .spinner { display: inline-block; }
        .btn-loading .btn-text { display: none; }
        .btn-loading { pointer-events: none; opacity: 0.8; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-brand">
                <h1>School<span>ERP</span></h1>
                <p>School Management System</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="loginEmail">Email <span class="required">*</span></label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="admin@school.edu" value="admin@school.edu" required />
                </div>
                <div class="form-group">
                    <label class="form-label" for="loginPassword">Password <span class="required">*</span></label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" value="password123" required />
                </div>
                <div class="form-group d-flex align-center justify-between">
                    <label style="display:flex; align-items:center; gap:6px; font-size:14px; color:var(--gray-600);">
                        <input type="checkbox" checked /> Remember me
                    </label>
                    <a href="#" style="font-size:14px;">Forgot Password?</a>
                </div>
                <button type="submit" class="btn btn-primary w-100" id="loginBtn" style="justify-content:center; padding:10px;">
                    <span class="btn-text">Sign In</span>
                    <span class="spinner" style="display:none;"></span>
                </button>
            </form>
            <div class="login-footer">
                <p>Demo: admin@school.edu / password123</p>
            </div>
        </div>
    </div>

    <!-- Firebase & Login Script -->
    <script type="module">
        import { auth, signInWithEmailAndPassword, onAuthStateChanged } from './assets/js/firebase.js';

        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('loginEmail');
        const passwordInput = document.getElementById('loginPassword');
        const loginBtn = document.getElementById('loginBtn');

        // Check if already logged in
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Already logged in, redirect to dashboard
                window.location.href = 'dashboard.html';
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                showToast('Please fill in all fields.', 'warning');
                return;
            }

            // Show loading state
            loginBtn.classList.add('btn-loading');
            loginBtn.querySelector('.spinner').style.display = 'inline-block';
            loginBtn.querySelector('.btn-text').textContent = 'Signing in...';

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                // Success - redirect will be handled by onAuthStateChanged
                showToast('Login successful!', 'success');
                // Redirect after a short delay to allow toast
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 500);
            } catch (error) {
                // Reset loading state
                loginBtn.classList.remove('btn-loading');
                loginBtn.querySelector('.spinner').style.display = 'none';
                loginBtn.querySelector('.btn-text').textContent = 'Sign In';

                // Handle Firebase errors
                let message = 'Login failed. Please try again.';
                switch (error.code) {
                    case 'auth/user-not-found':
                        message = 'No user found with this email.';
                        break;
                    case 'auth/wrong-password':
                        message = 'Incorrect password.';
                        break;
                    case 'auth/invalid-email':
                        message = 'Invalid email format.';
                        break;
                    case 'auth/too-many-requests':
                        message = 'Too many attempts. Please try later.';
                        break;
                    default:
                        message = error.message;
                }
                showToast(message, 'error');
            }
        });

        // Toast function from global script (should be available)
        // If not, define it here (but we rely on script.js)
        // The global script.js already defines showToast, so we assume it's loaded.
        // However, we need to ensure script.js is loaded as well.
        // In our case, we'll load script.js as a regular script (not module) before this module.
        // We'll add a script tag for script.js in the head (or before this script).
        // Since we have a regular script tag in the head for script.js, it's fine.
        // We'll keep the existing script tag for script.js (non-module) and add our module after.
    </script>
    <!-- Load global script (non-module) -->
    <script src="assets/js/script.js"></script>
</body>
</html>
