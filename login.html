<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School ERP | Login</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <style>
        /* Quick inline override for login background */
        body {
            background: var(--gray-100);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        .login-card {
            background: var(--white);
            border-radius: var(--border-radius);
            border: 1px solid var(--gray-200);
            padding: 32px 28px;
            box-shadow: var(--shadow-md);
        }
        .login-brand {
            text-align: center;
            margin-bottom: 28px;
        }
        .login-brand h1 {
            font-size: 26px;
            font-weight: 700;
            color: var(--gray-900);
            letter-spacing: -0.5px;
        }
        .login-brand span {
            color: var(--primary);
        }
        .login-brand p {
            color: var(--gray-500);
            font-size: 14px;
            margin-top: 4px;
        }
        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--gray-500);
        }
        .login-footer a {
            color: var(--primary);
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-brand">
                <h1>School<span>ERP</span></h1>
                <p>School Management System</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="loginEmail">Email <span class="required">*</span></label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="admin@school.edu" value="admin@school.edu" required />
                </div>
                <div class="form-group">
                    <label class="form-label" for="loginPassword">Password <span class="required">*</span></label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" value="password123" required />
                </div>
                <div class="form-group d-flex align-center justify-between">
                    <label style="display:flex; align-items:center; gap:6px; font-size:14px; color:var(--gray-600);">
                        <input type="checkbox" checked /> Remember me
                    </label>
                    <a href="#" style="font-size:14px;">Forgot Password?</a>
                </div>
                <button type="submit" class="btn btn-primary w-100" style="justify-content:center; padding:10px;">
                    Sign In
                </button>
            </form>
            <div class="login-footer">
                <p>Demo: admin@school.edu / password123</p>
            </div>
        </div>
    </div>
    <script src="assets/js/script.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Phase 2: Firebase Auth here. Phase 1: just redirect.
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
