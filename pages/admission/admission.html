<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School ERP | Students</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/students.css" />
    <!-- Import Map for Firebase Modular SDK -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js",
                "firebase/database": "https://www.gstatic.com/firebasejs/10.12.4/firebase-database.js"
            }
        }
    </script>
</head>
<body>

    <!-- ===== SIDEBAR (unchanged) ===== -->
    <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main Navigation">
        <!-- ... same sidebar as before ... -->
        <!-- To keep the response concise, we assume the sidebar is exactly as before. -->
        <!-- In practice, you would copy the full sidebar from the previous students.html -->
        <!-- For brevity, we omit it here; the actual file should include it. -->
    </aside>

    <!-- ===== MAIN WRAPPER ===== -->
    <div class="main-wrapper">
        <!-- Header -->
        <header class="main-header">
            <!-- ... same header ... -->
        </header>

        <!-- Page Content -->
        <main class="page-content">
            <!-- Page Header -->
            <div class="page-header">
                <h1 class="page-title">Student Records</h1>
                <div class="page-actions">
                    <button class="btn btn-primary" id="openStudentModalBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                        Add Student
                    </button>
                    <button class="btn btn-outline-primary" id="exportBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        Export
                    </button>
                </div>
            </div>

            <!-- Filters -->
            <div class="student-filters">
                <div class="filter-group">
                    <select class="form-control form-control-sm" id="filterClass">
                        <option value="">All Classes</option>
                        <!-- Updated to match Admission classes -->
                        <option>Nursery</option>
                        <option>LKG</option>
                        <option>UKG</option>
                        <option>Class 1</option>
                        <option>Class 2</option>
                        <option>Class 3</option>
                        <option>Class 4</option>
                        <option>Class 5</option>
                        <option>Class 6</option>
                        <option>Class 7</option>
                        <option>Class 8</option>
                    </select>
                    <select class="form-control form-control-sm" id="filterSection">
                        <option value="">All Sections</option>
                        <option>A</option>
                        <option>B</option>
                        <option>C</option>
                        <option>NA</option>
                    </select>
                    <select class="form-control form-control-sm" id="filterStatus">
                        <option value="">All Status</option>
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                        <option value="graduated">Graduated</option>
                    </select>
                    <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="Search by name or ID" />
                    <button class="btn btn-primary btn-sm" id="applyFilterBtn">Filter</button>
                    <button class="btn btn-sm" id="resetFilterBtn">Reset</button>
                </div>
            </div>

            <!-- Students Table -->
            <div class="card">
                <div class="card-body p-0">
                    <table class="table student-table" id="studentTable">
                        <thead>
                            <tr>
                                <th><input type="checkbox" id="selectAll" /></th>
                                <th>Student</th>
                                <th>Class</th>
                                <th>Roll No</th>
                                <th>Parent Contact</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="studentTableBody">
                            <tr>
                                <td colspan="7" class="text-center">Loading students...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <!-- Pagination -->
                <div class="card-footer d-flex align-center justify-between">
                    <span class="text-muted" id="studentCount">Showing 0 entries</span>
                    <div class="pagination">
                        <button class="btn btn-sm" id="prevPage">Prev</button>
                        <button class="btn btn-sm btn-primary" id="page1">1</button>
                        <button class="btn btn-sm" id="nextPage">Next</button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="main-footer">
            <span>&copy; 2026 SchoolERP. All rights reserved.</span>
            <span>Version 1.0.0</span>
        </footer>
    </div>

    <!-- ===== STUDENT MODAL (Add/Edit) ===== -->
    <div class="modal-overlay" id="studentModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="studentModalTitle">Add Student</h3>
                <button class="modal-close" id="closeStudentModal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="studentForm">
                    <input type="hidden" id="editStudentId" />
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="studentName">Full Name <span class="required">*</span></label>
                            <input type="text" id="studentName" class="form-control" placeholder="Enter full name" required />
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="studentClass">Class <span class="required">*</span></label>
                            <select id="studentClass" class="form-control" required>
                                <option value="">Select Class</option>
                                <!-- Updated to match Admission classes -->
                                <option>Nursery</option>
                                <option>LKG</option>
                                <option>UKG</option>
                                <option>Class 1</option>
                                <option>Class 2</option>
                                <option>Class 3</option>
                                <option>Class 4</option>
                                <option>Class 5</option>
                                <option>Class 6</option>
                                <option>Class 7</option>
                                <option>Class 8</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="rollNo">Roll Number</label>
                            <input type="text" id="rollNo" class="form-control" placeholder="e.g., 101" />
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="studentStatus">Status</label>
                            <select id="studentStatus" class="form-control">
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                                <option value="graduated">Graduated</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="parentName">Parent / Guardian</label>
                            <input type="text" id="parentName" class="form-control" placeholder="Enter parent name" />
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="parentPhone">Parent Phone</label>
                            <input type="tel" id="parentPhone" class="form-control" placeholder="Enter phone number" />
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="studentAddress">Address</label>
                        <textarea id="studentAddress" class="form-control" rows="2" placeholder="Enter address"></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn" id="cancelStudentBtn">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="submitStudentBtn">
                            <span class="btn-text">Save Student</span>
                            <span class="spinner" style="display:none;"></span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ===== CONFIRMATION DIALOG ===== -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal" style="max-width:400px;">
            <div class="modal-header">
                <h3 class="modal-title">Confirm Deletion</h3>
                <button class="modal-close" id="closeConfirmModal">&times;</button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this student record? This action cannot be undone.</p>
                <div class="form-actions">
                    <button class="btn" id="cancelConfirmBtn">Cancel</button>
                    <button class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== GLOBAL SCRIPTS ===== -->
    <script src="../../assets/js/script.js"></script>

    <!-- ===== STUDENTS MODULE EXTERNAL SCRIPT ===== -->
    <script type="module" src="../../assets/js/students.js"></script>

</body>
</html>
