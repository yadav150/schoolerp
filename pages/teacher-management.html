<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Management - EduERP</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/teacher-management.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="sidebar-logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                    <path d="M6 12v5c0 1.1 2.7 2 6 2s6-.9 6-2v-5"/>
                </svg>
            </div>
            <div class="sidebar-title">
                <h2>EduERP</h2>
                <span>School Management</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a href="../index.html" class="nav-item" data-page="dashboard">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
                    <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
                </svg>
                <span>Dashboard</span>
            </a>
            <a href="student-management.html" class="nav-item" data-page="students">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
                <span>Students</span>
            </a>
            <a href="teacher-management.html" class="nav-item active" data-page="teachers">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                </svg>
                <span>Teachers</span>
            </a>
            <a href="fee-management.html" class="nav-item" data-page="fees">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                </svg>
                <span>Fee Management</span>
            </a>
            <a href="salary-management.html" class="nav-item" data-page="salary">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
                    <circle cx="12" cy="14" r="2"/>
                </svg>
                <span>Salary</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <span class="version-badge">v1.0.0</span>
        </div>
    </aside>

    <header class="mobile-header" id="mobileHeader">
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
        </button>
        <span class="mobile-brand">EduERP</span>
    </header>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main-content" id="mainContent">
        <div class="page-header">
            <div>
                <h1 class="page-title">Teacher Management</h1>
                <p class="page-subtitle">Add, edit, and manage teacher records.</p>
            </div>
            <button class="btn btn-primary" id="addTeacherBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                Add Teacher
            </button>
        </div>

        <div class="filter-bar">
            <div class="search-box">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="text" id="searchInput" placeholder="Search by name, ID, or subject...">
            </div>
            <select id="subjectFilter" class="form-select">
                <option value="">All Subjects</option>
                <option value="Mathematics">Mathematics</option>
                <option value="English">English</option>
                <option value="Science">Science</option>
                <option value="Social Studies">Social Studies</option>
                <option value="Computer">Computer</option>
                <option value="Art">Art</option>
            </select>
            <div class="export-buttons">
                <button class="btn btn-outline btn-sm" id="exportCSV">CSV</button>
                <button class="btn btn-outline btn-sm" id="exportExcel">Excel</button>
                <button class="btn btn-outline btn-sm" id="printTable">Print</button>
            </div>
        </div>

        <div class="table-container">
            <table class="data-table" id="teacherTable">
                <thead>
                    <tr>
                        <th>Teacher ID</th>
                        <th>Name</th>
                        <th>Subject</th>
                        <th>Phone</th>
                        <th>Monthly Salary</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="teacherTableBody">
                    <tr><td colspan="6" class="empty-state">No teachers found.</td></tr>
                </tbody>
            </table>
        </div>
        <div class="table-info">
            <span id="recordCount">0</span> teachers
        </div>
    </main>

    <!-- Add/Edit Teacher Modal -->
    <div class="modal-overlay" id="teacherModal">
        <div class="modal-dialog">
            <div class="modal-header">
                <h3 id="modalTitle">Add Teacher</h3>
                <button class="modal-close" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <form id="teacherForm" novalidate>
                    <input type="hidden" id="teacherId">
                    <div class="form-group">
                        <label for="teacherCode">Teacher ID *</label>
                        <input type="text" id="teacherCode" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label for="teacherName">Full Name *</label>
                        <input type="text" id="teacherName" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label for="subject">Subject *</label>
                        <select id="subject" class="form-input" required>
                            <option value="">Select Subject</option>
                            <option value="Mathematics">Mathematics</option>
                            <option value="English">English</option>
                            <option value="Science">Science</option>
                            <option value="Social Studies">Social Studies</option>
                            <option value="Computer">Computer</option>
                            <option value="Art">Art</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number *</label>
                        <input type="tel" id="phone" class="form-input" placeholder="10-digit number" required pattern="[0-9]{10}">
                    </div>
                    <div class="form-group">
                        <label for="salary">Monthly Salary (₹)</label>
                        <input type="number" id="salary" class="form-input" min="0" step="100" value="0">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
                <button class="btn btn-primary" id="saveTeacherBtn">Save Teacher</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>
    <div class="modal-overlay" id="confirmModal">
        <div class="modal-dialog modal-sm">
            <div class="modal-header">
                <h3 id="confirmTitle">Are you sure?</h3>
            </div>
            <div class="modal-body">
                <p id="confirmMessage">This action cannot be undone.</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="confirmCancel">Cancel</button>
                <button class="btn btn-danger" id="confirmOk">Confirm</button>
            </div>
        </div>
    </div>

    <script src="../js/script.js"></script>
    <script src="../js/teacher-management.js"></script>
</body>
</html>
